<div
  id="member-functionaries"
  hx-target="this"
  hx-swap="outerHTML"
>
  <h3 class="list-inline-item">Poster</h3>

  {% if combined %}
  <button
    hx-get="{% url 'katalogen:profile_functionaries' member.id %}?combine=0"
    class="btn btn-link p-0 mb-1 list-inline-item fa fa-expand-arrows-alt"
    title="Splittra poster och sortera dem enligt datum"
  ></button>
  {% elif functionary_type_durations %}
  <button
    hx-get="{% url 'katalogen:profile_functionaries' member.id %}?combine=1"
    class="btn btn-link p-0 mb-1 list-inline-item fa fa-compress-arrows-alt"
    title="Kombinera poster och sortera dem i alfabetisk ordning"
  ></button>
  {% endif %}

  <table class="table table-striped table-borderless table-sm">
    {% for ft, duration in functionary_type_durations %}
      <tr>
        <th><a href="{% url 'katalogen:functionary_type' ft.id %}">{{ ft.name }}</a></td>
        <td class="text-right">{{ duration }}</td>
      </tr>
    {% empty %}
      <tr>
        <td><i>Inga poster hittades</i></td>
      </tr>
    {% endfor %}
  </table>
</div>
