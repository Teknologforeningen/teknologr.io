<div
  id="member-groups"
  hx-target="this"
  hx-swap="outerHTML"
>
  <h3 class="list-inline-item">Grupper</h3>

  {% if combined %}
  <button
    hx-get="{% url 'katalogen:profile_groups' member.id %}?combine=0"
    class="btn btn-link p-0 mb-1 list-inline-item fa fa-expand-arrows-alt"
    title="Splittra grupper och sortera dem enligt datum"
  ></button>
  {% elif group_type_durations %}
  <button
    hx-get="{% url 'katalogen:profile_groups' member.id %}?combine=1"
    class="btn btn-link p-0 mb-1 list-inline-item fa fa-compress-arrows-alt"
    title="Kombinera grupper och sortera dem i alfabetisk ordning"
  ></button>
  {% endif %}

  <table class="table table-striped table-borderless table-sm">
    {% for gt, duration in group_type_durations %}
      <tr>
        <th><a href="{% url 'katalogen:groups' gt.id %}">{{ gt.name }}</a></th>
        <td class="text-right">{{ duration }}</td>
      </tr>
    {% empty %}
      <tr>
        <td><i>Inga grupper hittades</i></td>
      </tr>
    {% endfor %}
  </table>
</div>
