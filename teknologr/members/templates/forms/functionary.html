<form
  autocomplete="off"
  {% if form.instance.pk %}
    hx-put="{% url 'api:functionary-detail' form.instance.pk %}"
  {% else %}
    data-custom-confirm="multi-member"
    hx-post="{% url 'api:multi_functionaries' %}"
  {% endif %}
  hx-swap="none"
  hx-on::after-request="if (event.detail.successful) window.location.reload()"
>
  {% if form.member.initial %}
  {{ form.member.as_hidden }}
  {% else %}
  {{ form.media }}
  <div class="row form-group">
    <div class="col-3">
      <label for="{{ form.member.id_for_label }}">Medlem</label>
    </div>
    <div class="col-6">
      {{ form.member }}
    </div>
    <div class="col-3">
      <button disabled id="fform-create-member" class="btn btn-warning float-right">Skapa ny</button>
    </div>
  </div>
  {% endif %}

  {% if form.functionarytype.initial %}
  {{ form.functionarytype.as_hidden }}
  {% else %}
  <div class="row form-group">
    <div class="col-3">
      <label for="{{ form.functionarytype.id_for_label }}">Post</label>
    </div>
    <div class="col-9">
      {{ form.functionarytype }}
    </div>
  </div>
  {% endif %}

  <div class="row form-group">
    <div class="col-3">
      <label for="{{ form.begin_date.id_for_label }}">Från</label>
    </div>
    <div class="col-9">
      {{ form.begin_date }}
    </div>
  </div>

  <div class="row form-group">
    <div class="col-3">
      <label for="{{ form.end_date.id_for_label }}">Till</label>
    </div>
    <div class="col-9">
      {{ form.end_date }}
    </div>
  </div>

  <div class="row form-group">
    <div class="col">
      <button id="fform-submit-functionaries" type="submit" class="btn btn-success float-right">Spara</button>
    </div>
  </div>
</form>
