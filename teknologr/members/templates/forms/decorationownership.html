<form
  autocomplete="off"
  {% if form.instance.pk %}
    hx-put="{% url 'api:decorationownership-detail' form.instance.pk %}"
  {% else %}
    data-custom-confirm="multi-member"
    hx-post="{% url 'api:multi_decorationownerships' %}"
  {% endif %}
  hx-swap="none"
  hx-on::after-request="if (event.detail.successful) window.location.reload()"
>
  {% if form.member.initial %}
  {{ form.member.as_hidden }}
  {% else %}
  {{ form.media }}
  <div class="row form-group">
    <div class="col-3">
      <label for="{{ form.member.id_for_label }}">Medlem</label>
    </div>
    <div class="col-6">
      {{ form.member }}
    </div>
    <div class="col-3">
      <button disabled id="doform-create-member" class="btn btn-warning float-right">Skapa ny</button>
    </div>
  </div>
  {% endif %}

  {% if form.decoration.initial %}
  {{ form.decoration.as_hidden }}
  {% else %}
  <div class="row form-group">
    <div class="col-3">
      <label for="{{ form.decoration.id_for_label }}">Betygelse</label>
    </div>
    <div class="col-9">
      {{ form.decoration }}
    </div>
  </div>
  {% endif %}

  <div class="row form-group">
    <div class="col-3">
      <label for="{{ form.acquired.id_for_label }}">Utdelat</label>
    </div>
    <div class="col-9">
      {{ form.acquired }}
    </div>
  </div>

  <div class="row form-group">
    <div class="col">
      <button id="doform-submit-ownerships" type="submit" class="btn btn-success float-right">Spara</button>
    </div>
  </div>
</form>
