<form
  autocomplete="off"
  data-custom-confirm="multi-member"
  hx-post="{% url 'api:multi_groupmemberships' %}"
  hx-swap="none"
  hx-on::after-request="if (event.detail.successful) window.location.reload()"
>
  {% if form.member.initial %}
  {{ form.member.as_hidden }}
  {% else %}
  {{ form.media }}
  <div class="row form-group">
    <div class="col-3">
      <label for="{{ form.member.id_for_label }}">Namn</label>
    </div>
    <div class="col-6">
      {{ form.member }}
    </div>
    <div class="col-3">
      <button disabled id="gmform-create-member" class="btn btn-warning float-right">Skapa ny</button>
    </div>
  </div>
  {% endif %}

  {% if form.group.initial %}
  {{ form.group.as_hidden }}
  {% else %}
  <div class="row form-group">
    <div class="col-3">
      <label for="{{ form.group.id_for_label }}">Grupp</label>
    </div>
    <div class="col-9">
      {{ form.group }}
    </div>
  </div>
  {% endif %}

  <div class="row form-group">
    <div class="col">
      <button id="gmform-submit-memberships" type="submit" class="btn btn-success float-right">Spara</button>
    </div>
  </div>
</form>

<script>
  add_ajax_multiselect_extension({
    selector_button: "#gmform-create-member",
    selector_input: "#gmform_member_text",
    selector_submit: "#gmform-submit-memberships",
  });
</script>
