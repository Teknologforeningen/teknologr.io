{% extends "modals/modal.html" %}

{% block modalcontent %}
<form
  autocomplete="new-password"
  hx-post="{% url 'api:ldap_account' member.id %}"
  hx-swap="none"
  hx-on::after-request="if (event.detail.successful) window.location.reload()"
>
  {% csrf_token %}
  <div class="row form-group">
    <div class="col-4">
      <label for="username">Användarnamn</label>
      <a class="a-tooltip" href="javascript:;" data-toggle="tooltip" data-placement="top" title="Användarnamnet bör endast innehålla små bokstäver och siffror! Bortgår man från denna konvention riskerar man försvåra användarens chans att få ett BILL-konto."><i class="fa fa-question-circle" aria-hidden="true"></i></a>
    </div>
    <div class="col-8">
      <input class="form-control" maxlength="32" name="username" type="text" required />
    </div>
  </div>
  <div class="row form-group">
    <div class="col-4">
      <label for="password">Lösenord</label>
    </div>
    <div class="col-8">
      <input class="form-control" id="ldap_password" name="password" type="password" autocomplete="new-password" required />
    </div>
  </div>
  <div class="row form-group has-feedback">
    <div class="col-4">
      <label class="control-label" for="confirm_password">Repetera lösenord</label>
    </div>
    <div class="col-8">
      <input class="form-control" id="confirm_password" type="password" autocomplete="new-password" required/>
    </div>
  </div>
  <div class="row form-group">
    <div class="col-10 offset-1">
      <input class="form-check-input" type="checkbox" id="mail_to_user" name="mail_to_user" value="send" checked>
      <label class="control-label" for="mail_to_user">Skicka lösenordet åt användaren?</label>
    </div>
  </div>
  <div class="row">
    <div class="col-12">
      <button type="submit" class="btn btn-success float-right">Skicka</button>
    </div>
  </div>
</form>
{% endblock %}
